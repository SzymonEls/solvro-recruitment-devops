# domyślnie wszystko zablokowane
AllowGroups ssh-users
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowTcpForwarding no
GatewayPorts no
X11Forwarding no

# wyjątki
Match Group ssh-pass-ip Address 192.168.100.0/32
    PasswordAuthentication yes

Match Group ssh-pass-any
    PasswordAuthentication yes

Match Group ssh-forward
    AllowTcpForwarding yes

Match Group ssh-gateway
    AllowTcpForwarding yes
    GatewayPorts yes

Match Group ssh-x11
    X11Forwarding yes